name: Build SumatraPDF Release x64

on:
  push:
    branches:
      - "ci/sumatrapdf-mouse-361"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Build Release x64
        run: bun cmd/build.ts -rel

      - name: Record artifact metadata
        shell: pwsh
        run: |
          $exe = Get-Item "out/rel64/SumatraPDF.exe"
          $metadata = [pscustomobject]@{
            Path = $exe.FullName
            Length = $exe.Length
            LastWriteTime = $exe.LastWriteTime.ToString("o")
            FileVersion = $exe.VersionInfo.FileVersion
            SHA256 = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          }
          $metadata | Format-List | Out-File "out/rel64/build-metadata.txt" -Encoding utf8

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sumatrapdf-mouse-361-release-x64
          path: |
            out/rel64/SumatraPDF.exe
            out/rel64/libmupdf.dll
            out/rel64/build-metadata.txt
          if-no-files-found: error
          retention-days: 7
